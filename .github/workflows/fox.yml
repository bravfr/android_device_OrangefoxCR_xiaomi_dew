name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            make \
            ninja-build \
            ccache \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            rsync \
            cpio \
            kmod \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk

      - name: Initialize OrangeFox source
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh

      - name: Check OrangeFox source
        run: |
          echo "===== ROOT ====="
          ls -la "$GITHUB_WORKSPACE"

          echo "===== ENVSETUP ====="
          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -name "envsetup.sh" \
            -print

      - name: Add device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox/device/xiaomi"

          cp -r \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"

      - name: Clone dew kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox/device/xiaomi"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"

      - name: Show kernel files
        run: |
          echo "===== KERNEL ====="
          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo "===== DTB ====="
          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo "===== MODULES ====="
          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print

          echo "===== MODULE LOAD FILES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;

      - name: Prepare build
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-eng

      - name: Build OrangeFox
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-eng

          mka recoveryimage

      - name: Find output
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== RECOVERY OUTPUT ====="

          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            \( \
              -name "recovery.img" \
              -o -name "vendor_boot.img" \
              -o -name "boot.img" \
            \) \
            -exec ls -lh {} \;

      - name: Upload OrangeFox
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/recovery.img
            fox/out/target/product/dew/vendor_boot.img
            fox/out/target/product/dew/boot.img
          if-no-files-found: warn
