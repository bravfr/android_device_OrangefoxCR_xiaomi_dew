name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Descargar device tree
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 2. Instalar dependencias
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            make \
            ninja-build \
            ccache \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            rsync \
            cpio \
            kmod \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk


      # ============================================================
      # 3. Descargar OrangeFox
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh

          echo "===== WORKSPACE ====="
          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name "envsetup.sh" \
            -print

          echo "===== DIRECTORIES ====="
          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type d \
            -print

      # ============================================================
      # 4. Copiar device tree
      # ============================================================
      - name: Add device tree
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          cp -r \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 5. Descargar kernel precompilado
      # ============================================================
      - name: Clone dew kernel
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 6. Verificar kernel
      # ============================================================
      - name: Verify kernel
        run: |
          echo "===== KERNEL ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print


      # ============================================================
      # 7. Preparar compilación
      # ============================================================
      - name: Prepare build
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ENVSETUP ====="
          ls -lh build/envsetup.sh

          source build/envsetup.sh

          lunch fox_dew-eng


      # ============================================================
      # 8. Compilar OrangeFox
      # ============================================================
      - name: Build OrangeFox
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-eng

          mka recoveryimage


      # ============================================================
      # 9. Buscar resultados
      # ============================================================
      - name: Find output
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT DIRECTORY ====="

          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \;


      # ============================================================
      # 10. Subir imágenes
      # ============================================================
      - name: Upload OrangeFox
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
          if-no-files-found: warn
