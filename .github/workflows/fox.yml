name: Check dew dependencies

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Check available branches
        run: |
          echo "=== dew-kernel ==="
          git ls-remote --heads https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git

          echo "=== vendor_xiaomi_dew ==="
          git ls-remote --heads https://github.com/mt6768-devs/android_vendor_xiaomi_dew.git

          echo "=== hardware_mediatek ==="
          git ls-remote --heads https://github.com/mt6768-devs/android_hardware_mediatek.git

          echo "=== hardware_xiaomi ==="
          git ls-remote --heads https://github.com/mt6768-devs/android_hardware_xiaomi.git

          echo "=== sepolicy_vndr ==="
          git ls-remote --heads https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git
