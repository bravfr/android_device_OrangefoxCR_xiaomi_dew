name: Build OrangeFox Redmi 15C

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            cpio

      - name: Download OrangeFox source
        run: |
          mkdir -p ~/fox
          cd ~/fox
          git clone https://gitlab.com/OrangeFox/misc/scripts.git sync
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 14.0 --geometry minimal

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew

      - name: Build OrangeFox
        run: |
          cd ~/fox/fox_14.0
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=dew
          source build/envsetup.sh
          lunch fox_dew-eng
          mka vendorbootimage

      - name: Upload OrangeFox
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Redmi-15C
          path: ~/fox/fox_14.0/out/target/product/dew/vendor_boot.img
