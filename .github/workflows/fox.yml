name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      USE_CCACHE: 0
      NINJA_ARGS: "-j1"
      BUILD_NUMBER: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT DEVICE TREE
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 2. INITIAL RESOURCES
      # ============================================================
      - name: Initial runner resources
        run: |
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show || true

          echo
          echo "===== DISK ====="
          df -h /


      # ============================================================
      # 3. FREE MAXIMUM DISK SPACE
      # ============================================================
      - name: Free runner disk space
        run: |
          set -e

          echo "===== DISK BEFORE CLEANUP ====="
          df -h /

          echo
          echo "===== REMOVING LARGE UNUSED COMPONENTS ====="

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo
          echo "===== DISK AFTER CLEANUP ====="
          df -h /


      # ============================================================
      # 4. VERIFY SWAP
      # ============================================================
      - name: Verify swap
        run: |
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== MEMORY ====="
          free -h


      # ============================================================
      # 5. INSTALL REQUIRED DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            liblz4-tool \
            libssl-dev \
            libxml2-utils \
            lz4 \
            ninja-build \
            openjdk-11-jdk \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xsltproc \
            zip


      # ============================================================
      # 6. INSTALL REPO
      # ============================================================
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      # ============================================================
      # 7. INITIALIZE ORANGEFOX
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

          echo
          echo "===== ORANGEFOX ROOT ====="
          ls -la "$GITHUB_WORKSPACE/fox"

          echo
          echo "===== ENVSETUP ====="
          ls -lh "$GITHUB_WORKSPACE/fox/build/envsetup.sh"

          echo
          echo "===== DISK AFTER ORANGEFOX SYNC ====="
          df -h /


      # ============================================================
      # 8. COPY DEVICE TREE
      # ============================================================
      - name: Add device tree
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          rm -rf \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"

          cp -a \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 9. CLONE PREBUILT KERNEL
      # ============================================================
      - name: Clone dew kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 10. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        run: |
          set -e

          echo "===== KERNEL ====="

          test -f \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          test -f \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print || true

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print || true


      # ============================================================
      # 11. CLONE MEDIATEK SEPOLICY
      # ============================================================
      - name: Clone MediaTek sepolicy
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git \
            "$GITHUB_WORKSPACE/fox/device/mediatek/sepolicy_vndr"


      # ============================================================
      # 12. VERIFY DEVICE TREE
      # ============================================================
      - name: Verify device tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          echo "===== DEVICE TREE ====="

          find \
            device/xiaomi/dew \
            -maxdepth 2 \
            -type f \
            -print | sort

          echo
          echo "===== ANDROID PRODUCTS ====="

          cat \
            device/xiaomi/dew/AndroidProducts.mk

          echo
          echo "===== FOX PRODUCT ====="

          cat \
            device/xiaomi/dew/fox_dew.mk

          echo
          echo "===== DEVICE MK ====="

          cat \
            device/xiaomi/dew/device.mk

          echo
          echo "===== BOARD CONFIG ====="

          grep -E \
            "TARGET_|BOARD_|KERNEL|DTB|VENDOR|RECOVERY" \
            device/xiaomi/dew/BoardConfig.mk || true

          echo
          echo "===== DISK ====="

          df -h /

          echo
          echo "===== INODES ====="

          df -ih /


      # ============================================================
      # 13. PREPARE BUILD
      # ============================================================
      - name: Prepare build
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

          echo
          echo "===== LUNCH RESULT ====="

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "OUT_DIR=$OUT_DIR"


      # ============================================================
      # 14. FINAL RESOURCE CHECK
      # ============================================================
      - name: Final resource check
        run: |
          echo "===== FINAL PRE-BUILD CHECK ====="

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== DEVICE TREE ====="
          ls -la \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"

          echo
          echo "===== KERNEL ====="
          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="
          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== BUILD VARIABLES ====="
          echo "USE_CCACHE=$USE_CCACHE"
          echo "NINJA_ARGS=$NINJA_ARGS"


      # ============================================================
      # 15. START RESOURCE MONITOR
      # ============================================================
      - name: Start resource monitor
        run: |
          (
            while true
            do
              echo
              echo "============================================================"
              echo "===== RESOURCE MONITOR $(date) ====="
              echo "============================================================"

              echo
              echo "===== MEMORY ====="
              free -h

              echo
              echo "===== SWAP ====="
              swapon --show

              echo
              echo "===== DISK ====="
              df -h /

              echo
              echo "===== TOP MEMORY PROCESSES ====="
              ps aux --sort=-%mem | head -15

              echo
              echo "===== LOAD ====="
              uptime

              sleep 30
            done
          ) > "$GITHUB_WORKSPACE/resource-monitor.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/resource-monitor.pid"


      # ============================================================
      # 16. BUILD ORANGEFOX
      # ============================================================
      - name: Build OrangeFox
        timeout-minutes: 300
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          echo "===== STARTING ORANGEFOX BUILD ====="

          date

          echo
          echo "===== BUILD RESOURCES ====="

          free -h

          echo
          swapon --show

          echo
          df -h /

          echo
          echo "===== BUILD VARIABLES ====="

          echo "USE_CCACHE=$USE_CCACHE"
          echo "NINJA_ARGS=$NINJA_ARGS"

          echo
          echo "===== ENVSETUP ====="

          source build/envsetup.sh

          echo
          echo "===== LUNCH ====="

          lunch fox_dew-ap2a-eng

          echo
          echo "===== STARTING RECOVERYIMAGE ====="

          mka recoveryimage -j1


      # ============================================================
      # 17. STOP RESOURCE MONITOR
      # ============================================================
      - name: Stop resource monitor
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/resource-monitor.pid" ]; then
            kill "$(cat "$GITHUB_WORKSPACE/resource-monitor.pid")" || true
          fi


      # ============================================================
      # 18. FINAL RESOURCE REPORT
      # ============================================================
      - name: Final resource report
        if: always()
        run: |
          echo "===== FINAL MEMORY ====="

          free -h

          echo
          echo "===== FINAL SWAP ====="

          swapon --show

          echo
          echo "===== FINAL DISK ====="

          df -h /

          echo
          echo "===== RESOURCE MONITOR LOG ====="

          if [ -f "$GITHUB_WORKSPACE/resource-monitor.log" ]; then
            tail -200 \
              "$GITHUB_WORKSPACE/resource-monitor.log"
          fi


      # ============================================================
      # 19. FIND OUTPUT
      # ============================================================
      - name: Find output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT FILES ====="

          find \
            out/target/product/dew \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.img" \
              -o \
              -name "*.zip" \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null || true


      # ============================================================
      # 20. UPLOAD RESOURCE LOG
      # ============================================================
      - name: Upload resource monitor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-resource-monitor
          path: resource-monitor.log
          if-no-files-found: warn


      # ============================================================
      # 21. UPLOAD ORANGEFOX OUTPUT
      # ============================================================
      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
            fox/out/target/product/dew/*.zip
          if-no-files-found: error
