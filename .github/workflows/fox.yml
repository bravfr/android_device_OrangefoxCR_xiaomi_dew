name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Descargar device tree
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 2. Instalar dependencias
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            make \
            ninja-build \
            ccache \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            rsync \
            cpio \
            kmod \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      - name: Free disk space
        run: |
          echo "===== DISK BEFORE ====="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== DISK AFTER ====="
          df -h   

      # ============================================================
      # 3. Descargar OrangeFox
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

          echo "===== ORANGEFOX ROOT ====="
          ls -la "$GITHUB_WORKSPACE/fox"

          echo "===== ENVSETUP ====="
          ls -lh "$GITHUB_WORKSPACE/fox/build/envsetup.sh"

      # ============================================================
      # 4. Copiar device tree
      # ============================================================
      - name: Add device tree
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          cp -r \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 5. Descargar kernel precompilado
      # ============================================================
      - name: Clone dew kernel
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 6. Verificar kernel
      # ============================================================
      - name: Verify kernel
        run: |
          echo "===== KERNEL ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print

      - name: Clone MediaTek sepolicy
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git \
            "$GITHUB_WORKSPACE/fox/device/mediatek/sepolicy_vndr"

      - name: Check OrangeFox theme
        run: |
          find "$GITHUB_WORKSPACE/fox" \
            -type f \
            -name ui.xml

      # ============================================================
      # 7. Preparar compilación
      # ============================================================
      - name: Prepare build
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== ENVSETUP ====="

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

      - name: Monitor resources
        run: |
          echo "===== MEMORY ====="
          free -h

          echo "===== SWAP ====="
          swapon --show

          echo "===== DISK ====="
          df -h

          echo "===== TOP MEMORY PROCESSES ====="
          ps aux --sort=-%mem | head -15

      # ============================================================
      # 8. Compilar OrangeFox
      # ============================================================
      - name: Build OrangeFox
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          export USE_CCACHE=1
          export NINJA_ARGS="-j1"

          echo "===== BUILD RESOURCES ====="
          free -h
          swapon --show
          df -h

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

          echo "===== STARTING ORANGEFOX BUILD ====="

          mka -j1 recoveryimage


      # ============================================================
      # 9. Buscar resultados
      # ============================================================
      - name: Find output
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT DIRECTORY ====="

          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \;


      # ============================================================
      # 10. Subir imágenes
      # ============================================================
      - name: Upload OrangeFox
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
          if-no-files-found: warn
