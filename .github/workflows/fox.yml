name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT DEVICE TREE
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 2. FREE DISK SPACE
      # ============================================================
      - name: Free disk space
        run: |
          echo "===== DISK BEFORE ====="
          df -h

          echo
          echo "===== REMOVE LARGE PREINSTALLED SOFTWARE ====="

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "===== DISK AFTER ====="
          df -h


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            make \
            ninja-build \
            ccache \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            rsync \
            cpio \
            kmod \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk

          sudo apt-get clean


      # ============================================================
      # 4. CREATE SWAP
      # ============================================================
      - name: Configure swap
        run: |
          echo "===== SWAP BEFORE ====="
          free -h
          swapon --show || true

          if [ -f /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo
          echo "===== SWAP AFTER ====="
          free -h
          swapon --show


      # ============================================================
      # 5. INSTALL REPO TOOL
      # ============================================================
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      # ============================================================
      # 6. INITIALIZE ORANGEFOX
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

          echo "===== ORANGEFOX ROOT ====="
          ls -la "$GITHUB_WORKSPACE/fox"

          echo
          echo "===== ENVSETUP ====="
          ls -lh "$GITHUB_WORKSPACE/fox/build/envsetup.sh"


      # ============================================================
      # 7. COPY DEVICE TREE
      # ============================================================
      - name: Add device tree
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          rm -rf \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"

          cp -r \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 8. CLONE PREBUILT KERNEL
      # ============================================================
      - name: Clone dew kernel
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 9. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        run: |
          echo "===== KERNEL ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print


      # ============================================================
      # 10. CLONE MEDIATEK SEPOLICY
      # ============================================================
      - name: Clone MediaTek sepolicy
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git \
            "$GITHUB_WORKSPACE/fox/device/mediatek/sepolicy_vndr"


      # ============================================================
      # 11. CHECK ORANGEFOX THEME
      # ============================================================
      - name: Check OrangeFox theme
        run: |
          find "$GITHUB_WORKSPACE/fox" \
            -type f \
            -name ui.xml


      # ============================================================
      # 12. PREPARE BUILD
      # ============================================================
      - name: Prepare build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng


      # ============================================================
      # 13. CONFIGURE BUILD
      # ============================================================
      - name: Configure build
        run: |
          echo "===== BUILD CONFIGURATION ====="

          echo "NINJA_ARGS=-j2"
          echo "USE_CCACHE=1"

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "===== CPU ====="
          nproc


      # ============================================================
      # 14. MONITOR RESOURCES
      # ============================================================
      - name: Start resource monitor
        shell: bash
        run: |
          cat > /tmp/resource-monitor.sh <<'EOF'
          #!/bin/bash

          while true; do
            echo
            echo "===== RESOURCE MONITOR ====="
            date

            echo
            echo "--- MEMORY ---"
            free -h

            echo
            echo "--- SWAP ---"
            swapon --show

            echo
            echo "--- DISK ---"
            df -h /

            echo
            echo "--- LOAD ---"
            uptime

            sleep 60
          done
          EOF

          chmod +x /tmp/resource-monitor.sh

          nohup /tmp/resource-monitor.sh \
            > "$GITHUB_WORKSPACE/resource-monitor.log" \
            2>&1 &

          echo $! > /tmp/resource-monitor.pid


      # ============================================================
      # 15. BUILD ORANGEFOX
      # ============================================================
      - name: Build OrangeFox
        shell: bash
        env:
          USE_CCACHE: 1
          NINJA_ARGS: "-j2"
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          export USE_CCACHE=1
          export NINJA_ARGS="-j2"

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

          echo
          echo "===== BUILD RESOURCES ====="

          free -h
          swapon --show
          df -h /

          echo
          echo "===== STARTING ORANGEFOX BUILD ====="

          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"


      # ============================================================
      # 16. SHOW BUILD LOG IF FAILED
      # ============================================================
      - name: Show build logs
        if: always()
        run: |
          echo "===== BUILD LOG SIZE ====="

          ls -lh \
            "$GITHUB_WORKSPACE/orangefox-build.log" \
            2>/dev/null || true

          echo
          echo "===== RESOURCE MONITOR LOG ====="

          tail -100 \
            "$GITHUB_WORKSPACE/resource-monitor.log" \
            2>/dev/null || true


      # ============================================================
      # 17. FIND OUTPUT
      # ============================================================
      - name: Find output
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT DIRECTORY ====="

          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \;


      # ============================================================
      # 18. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
          if-no-files-found: warn


      # ============================================================
      # 19. UPLOAD LOGS
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-build-logs
          path: |
            orangefox-build.log
            resource-monitor.log
          if-no-files-found: ignore
