name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout device tree
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 2. Liberar espacio del runner
      # ============================================================
      - name: Free disk space
        run: |
          echo "===== DISK BEFORE ====="
          df -h

          echo "===== REMOVING LARGE PREINSTALLED PACKAGES ====="

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "===== DISK AFTER ====="
          df -h


      # ============================================================
      # 3. Crear SWAP robusto
      # ============================================================
      - name: Configure swap
        run: |
          echo "===== SWAP BEFORE ====="
          swapon --show || true

          if [ -f /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi

          echo "===== CREATING 8GB SWAP ====="

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "===== SWAP AFTER ====="
          swapon --show

          echo "===== MEMORY ====="
          free -h


      # ============================================================
      # 4. Instalar dependencias
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            gcc \
            g++ \
            make \
            ninja-build \
            ccache \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            rsync \
            cpio \
            kmod \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk


      # ============================================================
      # 5. Instalar repo
      # ============================================================
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      # ============================================================
      # 6. Descargar OrangeFox
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

          echo "===== ORANGEFOX ROOT ====="
          ls -la "$GITHUB_WORKSPACE/fox"

          echo "===== ENVSETUP ====="
          ls -lh "$GITHUB_WORKSPACE/fox/build/envsetup.sh"


      # ============================================================
      # 7. Copiar device tree
      # ============================================================
      - name: Add device tree
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          cp -r \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 8. Descargar kernel precompilado
      # ============================================================
      - name: Clone dew kernel
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 9. Verificar kernel
      # ============================================================
      - name: Verify kernel
        run: |
          echo "===== KERNEL ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print


      # ============================================================
      # 10. Descargar MediaTek SEPolicy
      # ============================================================
      - name: Clone MediaTek sepolicy
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git \
            "$GITHUB_WORKSPACE/fox/device/mediatek/sepolicy_vndr"


      # ============================================================
      # 11. Verificar tema OrangeFox
      # ============================================================
      - name: Check OrangeFox theme
        run: |
          echo "===== ORANGEFOX THEMES ====="

          find "$GITHUB_WORKSPACE/fox" \
            -type f \
            -name ui.xml \
            -print

          echo
          echo "===== PORTRAIT HDPI ====="

          ls -lh \
            "$GITHUB_WORKSPACE/fox/bootable/recovery/gui/theme/portrait_hdpi/ui.xml"


      # ============================================================
      # 12. Monitor de recursos
      # ============================================================
      - name: Monitor runner resources
        run: |
          echo "===== RUNNER RESOURCE LIMITS ====="

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "===== TOP MEMORY PROCESSES ====="
          ps aux --sort=-%mem | head -20

          echo
          echo "===== CGROUP MEMORY LIMIT ====="
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true

          echo
          echo "===== CGROUP MEMORY CURRENT ====="
          cat /sys/fs/cgroup/memory.current 2>/dev/null || true

          echo
          echo "===== CGROUP MEMORY EVENTS ====="
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true


      # ============================================================
      # 13. Preparar compilación
      # ============================================================
      - name: Prepare build
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== ENVSETUP ====="

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng


      # ============================================================
      # 14. Configurar recursos de compilación
      # ============================================================
      - name: Configure build resources
        run: |
          echo "===== BUILD RESOURCES ====="

          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "===== CPU ====="
          nproc

          # NO usar SOONG_UI_NINJA_ARGS
          #
          # Soong advierte que modificar esta variable
          # puede provocar fallos o resultados incorrectos.
          #
          # Dejamos Ninja limitado a 2 jobs.
          export USE_CCACHE=1
          export NINJA_ARGS="-j2"

          echo
          echo "NINJA_ARGS=$NINJA_ARGS"


      # ============================================================
      # 15. Build OrangeFox
      # ============================================================
      - name: Build OrangeFox
        timeout-minutes: 120
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== BUILD START ====="
          date

          echo
          echo "===== MEMORY BEFORE BUILD ====="
          free -h

          echo
          echo "===== SWAP BEFORE BUILD ====="
          swapon --show

          echo
          echo "===== DISK BEFORE BUILD ====="
          df -h

          echo
          echo "===== STARTING ORANGEFOX BUILD ====="

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

          export USE_CCACHE=1
          export NINJA_ARGS="-j2"

          mka recoveryimage


      # ============================================================
      # 16. Buscar resultados
      # ============================================================
      - name: Find output
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT DIRECTORY ====="

          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \;


      # ============================================================
      # 17. Subir imágenes
      # ============================================================
      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
          if-no-files-found: warn
