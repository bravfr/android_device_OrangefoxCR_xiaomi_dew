name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      USE_CCACHE: 0
      NINJA_ARGS: "-j1"

    steps:

      # ============================================================
      # 1. MAXIMIZE BUILD DISK SPACE
      # ============================================================
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"


      # ============================================================
      # 2. CHECKOUT DEVICE TREE
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/dew


      # ============================================================
      # 3. CHECK RESOURCES
      # ============================================================
      - name: Check runner resources
        run: |
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== INODES ====="
          df -ih /


      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            liblz4-tool \
            libssl-dev \
            libxml2-utils \
            lz4 \
            ninja-build \
            openjdk-11-jdk \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xsltproc \
            zip


      # ============================================================
      # 5. INSTALL REPO TOOL
      # ============================================================
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      # ============================================================
      # 6. INITIALIZE ORANGEFOX
      # ============================================================
      - name: Initialize OrangeFox source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

          echo
          echo "===== ORANGEFOX ROOT ====="

          ls -la "$GITHUB_WORKSPACE/fox"

          echo
          echo "===== DISK AFTER ORANGEFOX SYNC ====="

          df -h /


      # ============================================================
      # 7. COPY DEVICE TREE
      # ============================================================
      - name: Add device tree
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/fox/device/xiaomi"

          rm -rf \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"

          cp -a \
            "$GITHUB_WORKSPACE/device/xiaomi/dew" \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew"


      # ============================================================
      # 8. DOWNLOAD PREBUILT KERNEL
      # ============================================================
      - name: Clone dew kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_xiaomi_dew-kernel.git \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel"


      # ============================================================
      # 9. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        run: |
          set -e

          echo "===== KERNEL ====="

          test -f \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/kernel"

          echo
          echo "===== DTB ====="

          test -f \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          ls -lh \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/images/dtb/mt6768.dtb"

          echo
          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "*.ko" \
            -print || true

          echo
          echo "===== MODULES.LOAD ====="

          find \
            "$GITHUB_WORKSPACE/fox/device/xiaomi/dew-kernel/modules" \
            -type f \
            -name "modules.load*" \
            -print || true


      # ============================================================
      # 10. DOWNLOAD MEDIATEK SEPOLICY
      # ============================================================
      - name: Clone MediaTek sepolicy
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/mt6768-devs/android_device_mediatek_sepolicy_vndr.git \
            "$GITHUB_WORKSPACE/fox/device/mediatek/sepolicy_vndr"


      # ============================================================
      # 11. VERIFY DEVICE TREE
      # ============================================================
      - name: Verify device tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          echo "===== DEVICE TREE ====="

          find \
            device/xiaomi/dew \
            -maxdepth 2 \
            -type f \
            -print | sort

          echo
          echo "===== ANDROID PRODUCTS ====="

          cat \
            device/xiaomi/dew/AndroidProducts.mk

          echo
          echo "===== FOX PRODUCT ====="

          cat \
            device/xiaomi/dew/fox_dew.mk

          echo
          echo "===== DEVICE MK ====="

          cat \
            device/xiaomi/dew/device.mk

          echo
          echo "===== BOARD CONFIG ====="

          grep -E \
            "TARGET_|BOARD_|KERNEL|DTB|VENDOR|RECOVERY" \
            device/xiaomi/dew/BoardConfig.mk || true


      # ============================================================
      # 12. PREPARE BUILD
      # ============================================================
      - name: Prepare build
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch fox_dew-ap2a-eng

          echo
          echo "===== LUNCH RESULT ====="

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "OUT_DIR=$OUT_DIR"


      # ============================================================
      # 13. FINAL PRE-BUILD CHECK
      # ============================================================
      - name: Final pre-build resources
        run: |
          echo "===== FINAL PRE-BUILD CHECK ====="

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== INODES ====="
          df -ih /

          echo
          echo "===== BUILD VARIABLES ====="

          echo "USE_CCACHE=$USE_CCACHE"
          echo "NINJA_ARGS=$NINJA_ARGS"


      # ============================================================
      # 15. TEST SOONG BOOTSTRAP
      # ============================================================
      - name: Final build check
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== FINAL BUILD CHECK ====="

          free -h

          echo
          swapon --show

          echo
          df -h /

          echo
          df -ih /

          echo
          du -sh "$GITHUB_WORKSPACE/fox" || true


      # ============================================================
      # 16. BUILD ORANGEFOX
      # ============================================================
      - name: Build OrangeFox
        timeout-minutes: 300
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox"

          echo "===== STARTING ORANGEFOX BUILD ====="

          date

          echo
          echo "===== BUILD RESOURCES ====="

          free -h

          echo
          swapon --show

          echo
          df -h /

          echo
          echo "===== BUILD VARIABLES ====="

          echo "USE_CCACHE=$USE_CCACHE"
          echo "NINJA_ARGS=$NINJA_ARGS"

          echo
          echo "===== ENVSETUP ====="

          source build/envsetup.sh

          echo
          echo "===== LUNCH ====="

          lunch fox_dew-ap2a-eng

          echo
          echo "===== STARTING RECOVERYIMAGE ====="

          mka recoveryimage -j1


      # ============================================================
      # 17. FINAL RESOURCE REPORT
      # ============================================================
      - name: Final resource report
        if: always()
        run: |
          echo "===== FINAL MEMORY ====="
          free -h

          echo
          echo "===== FINAL SWAP ====="
          swapon --show

          echo
          echo "===== FINAL DISK ====="
          df -h /

          echo
          echo "===== FINAL INODES ====="
          df -ih /


      # ============================================================
      # 18. FIND OUTPUT
      # ============================================================
      - name: Find output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "===== OUTPUT FILES ====="

          find \
            out/target/product/dew \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.img" \
              -o \
              -name "*.zip" \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null || true


      # ============================================================
      # 19. UPLOAD ORANGEFOX
      # ============================================================
      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          path: |
            fox/out/target/product/dew/*.img
            fox/out/target/product/dew/*.zip
          if-no-files-found: error
